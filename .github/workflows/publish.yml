name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Tag-triggered publishing must run the same gates CI runs.  Failure here
  # blocks the publish job below: a release cannot ship a tree that fails its
  # own tests, types, lint or packaging smoke test.
  release-gate:
    name: Release acceptance gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test suite
        run: uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Check distributions
        run: uv run twine check dist/*

      - name: Clean wheel install and entry-point smoke test
        run: bash scripts/smoke_wheel.sh dist

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  pypi-publish:
    name: Build and publish Python distribution to PyPI
    needs: release-gate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/moesh
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download distributions built by the gate
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
