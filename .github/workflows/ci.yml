name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Confirm runtime Python version
        run: |
          uv run python -c "import sys; info = sys.version_info; expected = '${{ matrix.python-version }}'; assert f'{info.major}.{info.minor}' == expected, f'Expected {expected}, got {sys.version}'"
          uv run python -V

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      # The complete suite, not one file: the shell, transfer, relay and
      # operator-outcome tests are all release-relevant, and a release that
      # ships past a failing integration test is the failure this gate exists
      # to stop.
      - name: Test suite
        run: uv run pytest -q

      - name: Build package
        run: uv build

      - name: Check package distribution
        run: uv run twine check dist/*

  wheel-smoke:
    name: Clean wheel install
    runs-on: ubuntu-latest
    needs: quality

    env:
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --python 3.11

      - name: Confirm runtime Python version
        run: |
          uv run python -c "import sys; info = sys.version_info; assert f'{info.major}.{info.minor}' == '3.11', f'Expected 3.11, got {sys.version}'"
          uv run python -V

      - name: Build sdist and wheel
        run: uv build

      - name: Install the wheel outside the checkout and run every entry point
        run: bash scripts/smoke_wheel.sh dist
