# moesh — an SSH-like encrypted remote shell.
#
# One configuration file for the whole project: the dependency set, the
# linter, the formatter, the type checker and the test runner all read from
# here.  The environment is managed by uv (``uv sync``), and the lockfile
# pins it.
#
# The source layout is flat: the programs are scripts at the top of the tree
# — ``moesh-bridge.py``, ``moesh_tunnel.py`` and ``moesh_shell.py`` — and their
# names and paths are the contract the deployments and the systemd unit use.
# A package layout would rename them and break every receiver and agent host
# installed from this tree, so the scripts stay where they are.
#
# Both surfaces are supported, and they are built from the same files:
#
#   * source checkout — ``python3 moesh_tunnel.py``, as the systemd units and
#     the documentation invoke it, and as the test harness does;
#   * installed wheel — the ``[project.scripts]`` entry points below, one per
#     program.  ``scripts/smoke_wheel.sh`` runs every one of them from a clean
#     install outside the checkout, and CI fails if any of them cannot start.
#
# The wheel ships the top-level modules directly (``force-include`` below),
# including ``moesh-bridge.py``: ``moesh_bridge.py`` is the importable wrapper
# that the ``moesh-bridge`` entry point resolves next to itself.
[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "moesh"
version = "0.2.0a4"
description = "An SSH-like encrypted remote shell: Noise_XX over an HTTP/1.1 Upgrade, with a persistent shell"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Moe Shawky", email = "57296463+moeshawky@users.noreply.github.com" },
]
keywords = [
    "ssh",
    "noise-protocol",
    "remote-shell",
    "encrypted-tunnel",
    "pty",
    "relay",
    "moesh",
    "moecp",
]
classifiers = [
    # The version is 0.2.0a4, and the security policy calls the project
    # pre-1.0 with no stable series.  The classifier says what the version
    # says; it does not claim a beta.
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
    "Topic :: System :: Shells",
]
dependencies = [
    "noiseprotocol==0.3.1",
    "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/moeshawky/moesh"
Repository = "https://github.com/moeshawky/moesh"
Documentation = "https://github.com/moeshawky/moesh#readme"
Issues = "https://github.com/moeshawky/moesh/issues"
Changelog = "https://github.com/moeshawky/moesh/blob/master/CHANGELOG.md"

[project.scripts]
moesh = "moesh_shell:main"
moecp = "moecp:main"
moesh-tunnel = "moesh_tunnel:main"
moesh-relay = "moesh_relay:main"
moesh-bridge = "moesh_bridge:main"

[tool.hatch.build.targets.wheel.force-include]
"moesh_proto.py" = "moesh_proto.py"
"moesh_wire.py" = "moesh_wire.py"
"moesh_shell.py" = "moesh_shell.py"
"moesh_tunnel.py" = "moesh_tunnel.py"
"moesh_relay.py" = "moesh_relay.py"
"moesh_bridge.py" = "moesh_bridge.py"
"moesh-bridge.py" = "moesh-bridge.py"
"moecp.py" = "moecp.py"

[tool.hatch.build.targets.sdist]
include = [
    "moesh_*.py",
    "moecp.py",
    "moesh-bridge.py",
    "moesh-bridge.service",
    "moesh/**",
    "bench/**",
    "scripts/**",
    "tests/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "PROTOCOL.md",
    "SECURITY.md",
    "pyproject.toml",
    "uv.lock",
    "docs/**",
]

# ── Ruff (linter + formatter) ──────────────────────────────────────────
# The rule sets are chosen for what each one catches, not for coverage:
#   E,W   pycodestyle          F    pyflakes (undefined names, unused imports)
#   I    import order          UP   pyupgrade (modern syntax for our floor)
#   B    bugbear (bug patterns) SIM  simplifiable code
#   RUF  ruff-specific         C4   comprehensions
#   RET  return style          TC   type-checking imports
#   FA   future annotations    FURB refurb (hygiene-grade idioms)
#   S    bandit (security)     — per-file ignores below, because the test
#                                harness runs subprocesses on purpose.
# PTH (pathlib) is deliberately off: the tree uses os.path consistently, and
# rewriting every path call is churn, not quality.
[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "C4",
    "RET",
    "TC",
    "FA",
    "FURB",
    "S",
]
ignore = [
    "E501",   # the formatter owns the line length
    "S101",   # assert is the point of a test
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S603",   # subprocess with a fixed argument list is what the harness does
    "S607",   # the harness starts local processes by path
    "S404",   # the harness starts a subprocess on purpose
    "B011",   # assert False is a legitimate way to fail a test
]
"tests/harness.py" = [
    "S603",
    "S607",
    "S404",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ── mypy (type checker) ────────────────────────────────────────────────
# Strict: the tree annotates every public signature, so the checker is
# asked to hold that line.  ``ignore_errors`` is never used: a module that
# cannot be typed is fixed, not muted.
[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
files = ["moesh_proto.py", "moesh_tunnel.py", "moesh_shell.py", "moesh-bridge.py", "moesh_bridge.py", "moesh_relay.py", "moecp.py", "moesh", "tests"]

# The Noise library ships no type information.  Its results are cast to the
# types this project promises, at the four places they are used; the library
# itself is not analysed.
[[tool.mypy.overrides]]
module = ["noise.*"]
ignore_missing_imports = true

# ── pytest ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: binds real ports and spawns real processes (the default for this suite)",
]

# ── coverage ───────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["."]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
